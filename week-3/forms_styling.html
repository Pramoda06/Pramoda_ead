<!DOCTYPE html>
<html>
    <head>
        <title>Login Form</title>
    </head>
    <style>
        .container{
            background-color:aliceblue;
            border-radius:20px;
            border:solid black;
        }
        button{
            background-color:blue;
            color:azure;
            border-radius:5px;
        }
        .wrapper{
            display:flex;
            flex-direction:column;
            height:100vh;
            justify-content:center;
            align-items:center;
            width:50%;
        }
    </style>
    <body>
        <div class="wrapper">
            <div class="container">
                <h1>Login Form</h1>
                <p><b>Email-Id</b></p>
                <input type="email" placeholder="Enter your email id"> <br></br>
                <p><b>Password</b></p>
                <input type="password" placeholder="password"> <br></br>
                <button>Login</button>
            </div>
        </div>
    </body>
</html>
