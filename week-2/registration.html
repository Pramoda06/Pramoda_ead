<!DOCTYPE html>
<html>
<head>
  <title>Registration form</title>
</head>
<body>
  <h1 align="center">Student Registration </h1>
  <form align="center">
    Name:<input type="text"><br><br>
    Roll.No:<input type="number"><br><br>
    e-mail:<input type="email"><br><br>
    ph-no:<input type="number"><br><br>
    Gender:<br><br>
    <input type="radio" name="Gender">Male
    <input type="radio" name="Gender">female
    <input type="radio" name="Gender">others<br><br>
    Branch:<br>
    <select>
      <option>CSE</option>
      <option>IT</option>
      <option>MEC</option>
      <option>IOT</option>
      <option>BIO</option>
      <option>AIDS</option>
      <option>CSM</option>
      <option>ECE</option>
      <option>EEE</option>
    </select>
    <br><br>
    <button>submit</button>
    <input type="button" value="Reset">
  </form>
</body>
</html>
