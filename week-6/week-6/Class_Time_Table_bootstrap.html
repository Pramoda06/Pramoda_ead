<!DOCTYPE html>
<html>
    <head>
        <title>Time Table</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
       <table class="table table-bordered" id="time_table">
            <tr>
                <th>Period</th>
                <th>I</th>
                <th>II</th>
                <th>III</th>
                <th>BREAK</th>
                <th>IV</th>
                <th>V</th>
                <th>VI</th>
            </tr>
            <tr>
                <th>Day/Time</th>
                <th>9:10 - 10:10</th>
                <th>10:10 - 11:10</th>
                <th>11.15 - 12.15</th>
                <th>12:15 - 1:00</th>
                <th>1:00 - 2:00</th>
                <th>2:00 - 3:00</th>
                <th>3:00 - 4:00</th>
            </tr>
            <tr>
                <th>MON</th>
                <td>PE-1</td>
                <td>EEA</td>
                <td>PQT</td>
                <td rowspan="5" >LUNCH-BREAK</td>
                <td>DBMS</td>
                <td>lIBRARY</td>
                <td>SPORTS</td>
            </tr>
            <tr>
                <th>TUE</th>
                <td colspan="3" >DBMSLAB</td>
                <td>PQT</td>
                <td>EEA</td>
                <td>ES</td>
            </tr>
            <tr>
                <th>WED</th>
                <td>EAD</td>
                <td>PE-I</td>
                <td>PQT</td>
                <td colspan="3" >EADLAB</td>
            </tr>
            <tr>
                <th>THU</th>
                <td>DBMS</td>
                <td>EEA</td>
                <td>EAD</td>
                <td>PE-1</td>
                <td>ES</td>
                <td>PQT-TUT</td>
            </tr>
             <tr>
                <th>FRI</th>
                <td colspan="3" >MINI_PROJECT</td>
                <td>DBMS</td>
                <td>EAD</td>
                <td>MENTORING</td>
            </tr>
        </table>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
