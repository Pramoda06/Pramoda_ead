<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./style-2.css">
    </head>
    <body>
        <h1>STUDENT REGISTRATION FORM</h1>
<div class="container">
    <div class="container-1">
        <div class="mb-3">
             <label for="formGroupExampleInput" class="form-label"> Name</label>
            <input type="text" class="form-control" id="formGroupExampleInput" placeholder="Enter Name">
        </div>
        <div class="mb-3">
            <label for="formGroupExampleInput2" class="form-label">Roll no</label>
            <input type="numbber" class="form-control" id="formGroupExampleInput2" placeholder="Enter Roll no">
        </div>
        <div class="mb-3">
            <label for="formGroupExampleInput3" class="form-label">Email ID</label>
            <input type="email" class="form-control" id="formGroupExampleInput2" placeholder="Enter email ID">
        </div>
    </div>
    <div class="container-2">
         <label for="formGroupExampleInput2" class="form-label">Gender</label>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
            <label class="form-check-label" for="radioDefault1">Male</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
            <label class="form-check-label" for="radioDefault2">Female</label>
        </div>
    </div>
    <div class="container-3">
        <label for="formGroupExampleInput3" class="form-label">Branch</label>
        <div class="dropdown">
            <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">SELECT BRANCH</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">CSE</a></li>
                <li><a class="dropdown-item" href="#">AI & ML</a></li>
                <li><a class="dropdown-item" href="#">IT</a>+</li>
                <li><a class="dropdown-item" href="#">AIDS</a></li>
                <li><a class="dropdown-item" href="#">CIC</a></li>
                <li><a class="dropdown-item" href="#">MEC</a></li>
                <li><a class="dropdown-item" href="#">ECE</a></li>
                <li><a class="dropdown-item" href="#">EEE</a></li>
            </ul>
        </div>
    </div>
    <div class="container-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkDefault">
            <label class="form-check-label" for="checkDefault">PQT</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">EAD</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">EEA</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">DBMS</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">DM</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">Java</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">PYTHON</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">DCCST</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">DLCA</label>
        </div>
    </div>
    <button type="button" class="btn btn-success">Submit</button>
    <button type="button" class="btn btn-light">Reset</button>
    <div class="alert alert-success" role="alert">
        A simple success alert—check it out!
    </div>
</div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
